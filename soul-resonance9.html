function snd(t){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state=="suspended")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.connect(g);g.connect(ac.destination);
    o.type=t=="p"?"triangle":t=="g"?"sine":"sawtooth";
    o.frequency.setValueAtTime(t=="p"?520:t=="g"?380:t=="u"?240:t=="b"?160:t=="k"?280:t=="n"?660:t=="e"?780:140,n);
    o.frequency.exponentialRampToValueAtTime(t=="p"?1040:t=="g"?580:t=="u"?980:t=="b"?620:t=="k"?760:t=="n"?880:t=="e"?320:70,n+.16);
    g.gain.setValueAtTime(.22,n);g.gain.exponentialRampToValueAtTime(.01,n+.18);
    o.start(n);o.stop(n+.18);
    if(t=="p"||t=="u"){
      const o2=ac.createOscillator(),g2=ac.createGain();
      o2.connect(g2);g2.connect(ac.destination);o2.type="sine";
      o2.frequency.setValueAtTime(t=="p"?780:360,n);
      o2.frequency.exponentialRampToValueAtTime(t=="p"?1560:1470,n+.2);
      g2.gain.setValueAtTime(.14,n);g2.gain.exponentialRampToValueAtTime(.01,n+.22);
      o2.start(n);o2.stop(n+.22);
    }
  }catch(e){}
}
function playBeatStep(step){
  if(!bgmOn||menu||go)return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state=="suspended")ac.resume();
    const n=ac.currentTime,intense=(bb>0||excalTrial>0||awakened||ks);

      const o=ac.createOscillator(),g2=ac.createGain();

    let bFreq=0;

    else if(step==5)bFreq=261.6;else if(step==6)bFreq=293.7;else if(step==8)bFreq=196.0;
    else if(step==10)bFreq=349.2;else if(step==11)bFreq=293.7;else if(step==14)bFreq=261.6;
    if(bFreq>0){
      if(meister==3)bFreq*=0.5;
      const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
      o.type="triangle";f.type="lowpass";
      f.frequency.setValueAtTime(meister==3?340:520,n);f.frequency.exponentialRampToValueAtTime(160,n+.18);
      o.frequency.setValueAtTime(bFreq,n);
      g.gain.setValueAtTime(meister==3?.18:.14,n);g.gain.exponentialRampToValueAtTime(.002,n+.20);
      o.connect(f);f.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.20);
    }
    if(meister==0){
      const pianoNotes=[392.0,0,466.2,587.3,698.5,0,587.3,466.2,523.3,0,622.3,784.0,932.3,0,784.0,622.3];
      const pf=pianoNotes[step];
      if(pf>0){
        new Array(1,2).forEach((harm,idx)=>{ 
          const o=ac.createOscillator(),g=ac.createGain();
          o.type="sine";o.frequency.setValueAtTime(pf*harm,n);
          g.gain.setValueAtTime((awakened||intense?.07:.048)/(idx==0?1:3.5),n);
          g.gain.exponentialRampToValueAtTime(.001,n+.34);
          o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.34);
        });

    }else if(meister==1){
      const starNotes=[587.3,587.3,0,784.0,880.0,0,784.0,1046.5,880.0,0,784.0,659.3,587.3,0,784.0,880.0];
      const sf=starNotes[step];
      if(sf>0){
        const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
        o.type="triangle";f.type="lowpass";f.frequency.setValueAtTime(1600,n);f.frequency.exponentialRampToValueAtTime(420,n+.15);
        o.frequency.setValueAtTime(sf,n);
        g.gain.setValueAtTime(intense?.075:.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.16);
        o.connect(f);f.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.16);
      }
    }else if(meister==2){
      const kidNotes=[523.3,659.3,784.0,1046.5,1046.5,784.0,659.3,523.3,523.3,659.3,784.0,1046.5,1046.5,784.0,659.3,523.3];
      const kf=kidNotes[step];

      o.type="sine";o.frequency.setValueAtTime(kf,n);
      g.gain.setValueAtTime(.055,n);g.gain.exponentialRampToValueAtTime(.001,n+.24);
      o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.24);
    }else if(meister==3||meister==4){
      if(step==0||step==4||step==8||step==12){
        const cNotes=meister==4?(step<8?[329.6,493.9,659.3]:[293.7,440.0,587.3]):(step<8?[293.7,311.1,440.0]:[261.6,277.2,415.3]);
        cNotes.forEach(cf=>{
          const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
          o.type=meister==4?"sine":"triangle";f.type="lowpass";f.frequency.value=meister==4?1200:680;
          o.frequency.setValueAtTime(cf,n);
          g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(.045,n+.06);g.gain.exponentialRampToValueAtTime(.001,n+.45);
          o.connect(f);f.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.45);
        });
      }
    }

    if(step==0||step==6||step==10||(intense&&step==13)){
      let n1=392.0,n2=466.2,n3=587.3,n4=698.5;
      if(step==6){n1=523.3;n2=659.3;n3=784.0;n4=932.3}
      else if(step==10||step==13){n1=587.3;n2=740.0;n3=880.0;n4=1046.5}
      [n1,n2,n3,n4].forEach(hf=>{
        const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
        o.type="triangle";f.type="lowpass";f.frequency.setValueAtTime(1100,n);f.frequency.exponentialRampToValueAtTime(420,n+.24);
        o.frequency.setValueAtTime(hf,n);
        g.gain.setValueAtTime(.026,n);g.gain.exponentialRampToValueAtTime(.001,n+.26);
        o.connect(f);f.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.26);
      });
    }
  }catch(e){}
}
function sp(px,py,cl,n){for(let i=0;i<n;i++){const a=6.28*i/n+Math.random()*.3,v=70+Math.random()*190;pt.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:cl})}}

function processHit(t,pf,isExtra){

  const soulGain=excalTrial>0?2:1;

  if(meister==3&&pf)bb=Math.min(12,bb+1.5);

  if(t.tp==2){
    bb=meister==3?10:7;
    if(meister==1)sunFire=2;
    snd(meister==1||meister==2?"n":"b");
    if(meister==1||meister==2){
      sp(t.x,t.y,"#ffd740",24);sp(t.x,t.y,"#4deeea",14);

    }else{
      sp(t.x,t.y,"#08070c",28);sp(t.x,t.y,"#ff1e42",14);
      if(meister==3&&lv<3){lv++;pp.push({x:t.x,y:t.y-30,t:"BLACK BLOOD ABSORBED! +1 HEART (2X)",c:"#ff1e42",l:1.4})}
      else{pp.push({x:t.x,y:t.y-30,t:"BLACK BLOOD MADNESS! (2X)",c:"#ff1e42",l:1.3})}
    }
  }else{
    if(t.tp==1)wCount=1;else kCount=Math.min(99,kCount+soulGain);
    checkAwaken();
    const hitCol=meister==1?"#00b4ff":(meister==2?"#e040fb":(meister==3?"#38bdf8":(meister==4?"#facc15":(t.tp==1?"#d946ef":"#ff2a55"))));
    sp(t.x,t.y,pf?hitCol:"#fff",pf?20:12);
    if(!isExtra)pp.push({x:t.x,y:t.y-25,t:pf?(cb>1?"RESONANCE x"+cb:"PERFECT!"):"SLASH!",c:awakened?"#ffd740":(bb>0?"#ff1e42":(pf?hitCol:"#fff")),l:1});
  }

  if(!isExtra&&meister==2&&cb>0&&cb%8==0){
    sc+=888;rs=Math.min(100,rs+20);
    if(lv<3){lv++;pp.push({x:w/2,y:h*.32,t:"SYMMETRICAL 8! +888 & +1 HEART!",c:"#ffd740",l:1.5})}
    else{pp.push({x:w/2,y:h*.32,t:"SYMMETRICAL 8! +888!",c:"#ffd740",l:1.4})}
    sp(w/2,h*.4,"#ffd740",22);
  }

  sc+=Math.round((pf?(t.tp==1?200:100):50)*mMult);
  if(sc>saveData.hi[meister]){saveData.hi[meister]=sc;saveProg()}
  rs=Math.min(100,rs+(pf?(t.tp==1?35:20):10));
  sh.push({x:t.x,y:t.y,a:(Math.random()-.5)*1.4,s:pf?115:90,l:1,u:0,b:bb>0,ds:awakened,m:meister,shuriken:(meister==1&&!awakened&&(bb>0||cb>=10))});
}
function inpDown(e){
  if(!menu&&e&&e.clientX&&e.clientX>w-115&&e.clientY<60){bgmOn=!bgmOn;return}
  if(menu){
    const py=e&&e.clientY?e.clientY:h*.5;
    if(py<h*.40)meister=0;else if(py<h*.50)meister=1;else if(py<h*.60)meister=2;else if(py<h*.70)meister=3;else meister=4;
    menu=0;sc=cb=pfStreak=kHunterReady=rs=bb=mgUsed=kCount=wCount=awakened=shield=ultAnim=screech=excalTrial=prayerCd=0;
    excal=null;screechCd=22;excalCd=15;lv=3;go=0;sl=[];sh=[];pt=[];pp=[];fx=[];tm=.4;ks=null;ksCd=14;beatStep=0;beatTimer=0;

  }

      const pts=1500*(bb>0?2:1)*(excalTrial>0?3:1);
      sc+=pts;if(sc>saveData.hi[meister]){saveData.hi[meister]=sc;saveProg()}
      rs=Math.min(100,rs+50);kCount=Math.min(99,kCount+5);checkAwaken();
      fl=1;sk=.25;hitStop=.045;snd("u");sp(w/2,h*.48,"#ff1e42",35);sp(w/2,h*.48,"#4deeea",25);
      pp.push({x:w/2,y:h*.36,t:"KISHIN SHATTERED! +"+pts,c:"#4deeea",l:1.5});ks=null;ksCd=18;tm=.6;
    }
    return;
  }
  if(!sl.length)return;

  let ti=0;for(let i=1;i<sl.length;i++)if(sl[i].r<sl[ti].r)ti=i;

  const hitWin=(awakened?32:26)+(meister==2?8:0),pfWin=(awakened?15:12)+(meister==2?5:0),d=Math.abs(t.r-24);

  if(d<=hitWin){
    const pf=d<=pfWin;snd(pf?"p":"g");if(pf)hitStop=.025;sk=pf?.11:.06;
    if(meister==2&&t.pairId!==undefined){
      const pid=t.pairId;let firstTwin=true;

          const twin=sl.splice(i,1)[0];

        }

    }else{
      sl.splice(ti,1);processHit(t,pf,false);
      if(meister==4&&awakened){
        for(let i=sl.length-1;i>=0;i--){
          if(Math.hypot(sl[i].x-t.x,sl[i].y-t.y)<=145){
            const extra=sl.splice(i,1)[0];

            processHit(extra,pf,true);
          }
        }
      }
    }
    if(rs>=100){
      const kHunter=meister==0&&kHunterReady;rs=0;fl=1;sk=.3;hitStop=.04;snd("u");
      if(kHunter){shield=4;pfStreak=0;kHunterReady=0}
      if(meister==1)sunFire=2.5;if(meister==3)bb=Math.max(bb,6);
      ultAnim=1;ultType=meister==0?(kHunter?1:0):(meister==1?2:(meister==2?(awakened?4:3):(meister==3?5:6)));
      sh.push({x:w/2,y:h/2,a:-.25,s:Math.max(w,h)*.55,l:1,u:kHunter?2:1,b:bb>0,ds:awakened,m:meister,shuriken:0});
      const ultCol=meister==1?"#00b4ff":(meister==2?"#e040fb":(meister==3?"#ff1e42":(meister==4?"#facc15":"#4deeea")));
      const soulGain=excalTrial>0?2:1;
      sl.forEach(s=>{if(s.tp==1)wCount=1;else kCount=Math.min(99,kCount+soulGain);sp(s.x,s.y,ultCol,22)});
      checkAwaken();
      const ultBonus=(meister==2&&awakened)||kHunter?1500:700;
      sc+=Math.round((sl.length*300+ultBonus)*(bb>0?2:1)*(excalTrial>0?3:1));
      if(sc>saveData.hi[meister]){saveData.hi[meister]=sc;saveProg()}
      sl=[];
      const ultNames=["WITCH HUNTER!!","KISHIN HUNTER!! (SHIELDED)","SHADOW★STAR!!","PARENT'S SEVEN DAYS!!","DEATH CANNON GAUNTLETS!!","BLOODY NEEDLE!!","LAW ABIDING SILVER GUN!!"];
      pp.push({x:w/2,y:h*.35,t:ultNames[ultType],c:awakened||kHunter?"#ffd740":ultCol,l:1.5});
    }
  }else{cb=0;pfStreak=0;sk=.12;snd("m");pp.push({x:t.x,y:t.y-25,t:"TOO EARLY!",c:"#ff5e5e",l:.8})}

          for(let k=0;k<6;k++){const a=k*1.05+now*.003;x.beginPath();x.moveTo(Math.cos(a)*12,Math.sin(a)*12);x.lineTo(Math.cos(a)*22,Math.sin(a)*22);x.strokeStyle="#09080d";x.lineWidth=3;x.stroke()}
          x.beginPath();x.arc(0,0,15,0,6.28);x.fillStyle="#09080d";x.fill();x.strokeStyle="#ff1e42";x.lineWidth=2;x.stroke();
          new Array(-1,1).forEach(dir=>{x.fillStyle="#ff1e42";x.beginPath();x.moveTo(dir*3,1);x.lineTo(dir*11,-4);x.lineTo(dir*9,4);x.closePath();x.fill()});
        }
        x.restore();
        const wob=screech>0?Math.sin(now*.025+s.x)*9:0,dispR=Math.max(0,s.r+wob),pfWin=(awakened?15:12)+(meister==2?5:0),sw=Math.abs(s.r-24)<=pfWin;
        if(meister==2){
          const offset=Math.max(0,dispR-24)*2.2,dir=s.x<w/2?-1:1,cx=s.x+dir*offset;
          x.strokeStyle=sw?"#ffd740":(screech>0?"#ff1e42":"#e040fb");x.lineWidth=sw?3.5:2.2;
          x.beginPath();x.arc(cx,s.y,22,0,6.28);x.moveTo(cx-30,s.y);x.lineTo(cx+30,s.y);x.moveTo(cx,s.y-30);x.lineTo(cx,s.y+30);x.stroke();
        }else{
          x.beginPath();x.arc(s.x,s.y,dispR,0,6.28);x.strokeStyle=sw?"#4deeea":(screech>0?"#ff1e42":"rgba(255,255,255,.9)");x.lineWidth=sw?4.5:2.5;x.stroke();
        }
      });
    }
    fx.forEach(f=>{
      x.save();x.globalAlpha=Math.max(0,f.l);
      if(f.tp==0){x.fillStyle="#ffd740";x.font="bold 30px sans-serif";x.textAlign="center";x.fillText("♫",f.x,f.y-(1-f.l)*25)}
      else if(f.tp==1){x.strokeStyle="#09080d";x.lineWidth=8;x.beginPath();x.moveTo(f.sx,f.sy);x.quadraticCurveTo((f.sx+f.x)/2,f.y-40,f.x,f.y);x.stroke();x.strokeStyle="#00b4ff";x.lineWidth=2.5;x.stroke()}
      else if(f.tp==2){x.strokeStyle="#e040fb";x.lineWidth=5;x.beginPath();x.moveTo(f.sx,f.sy);x.lineTo(f.x,f.y);x.stroke();x.strokeStyle="#fff";x.lineWidth=2;x.stroke()}
      else if(f.tp==4){x.strokeStyle="#facc15";x.lineWidth=6;x.beginPath();x.moveTo(f.sx,f.sy);x.lineTo(f.x,f.y);x.stroke();x.strokeStyle="#dc2626";x.lineWidth=2.5;x.stroke()}
      else{x.strokeStyle="#09080d";x.lineWidth=7;x.beginPath();x.moveTo(f.sx,f.sy);x.lineTo(f.x,f.y);x.stroke();x.strokeStyle="#ff1e42";x.lineWidth=2.5;x.stroke()}
      x.restore();
    });
    sh.forEach(drawWeapon);
    pt.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.beginPath();x.arc(p.x,p.y,4,0,6.28);x.fillStyle=p.c;x.fill()});
    pp.forEach(p=>{x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.font="bold 17px sans-serif";x.textAlign="center";x.fillText(p.t,p.x,p.y)});

    x.globalAlpha=1;x.fillStyle="#fff";x.font="bold 34px sans-serif";x.textAlign="center";x.fillText(sc,w/2,58);
    x.textAlign="left";x.font="bold 13px sans-serif";
    const awLbls=new Array("★ DEATH SCYTHE + PIANO","★ WARRIOR UNCANNY SWORD","★ SANZU GAUNTLETS","★ BLACK DRAGON RAGNAROK","★ MADNESS EXECUTIONER (AOE)");
    x.fillStyle=awakened?"#ffd740":(meister==1&&bb<=0?"#12101a":(meister==3?"#38bdf8":(meister==4?"#facc15":"#ff2a55")));
    x.fillText(awakened?awLbls[meister]:(meister==3?"HUMAN SOULS: ":"KISHIN SOULS: ")+kCount+"/99",18,34);
    x.fillStyle=wCount?"#d946ef":(meister==1&&bb<=0?"rgba(18,16,26,.65)":"rgba(255,255,255,.45)");
    x.fillText("WITCH SOUL: "+wCount+"/1",18,54);

    x.textAlign="right";x.font="bold 12px sans-serif";x.fillStyle=bgmOn?(meister==1&&bb<=0?"#12101a":"#4deeea"):"rgba(255,255,255,.4)";
    x.fillText(bgmOn?"♪ BGM: ON [M]":"♪ BGM: OFF [M]",w-18,34);

    x.textAlign="center";
    if(bb>0&&!mg&&!ks){x.fillStyle=meister==1||meister==2?"#ffd740":"#ff1e42";x.font="bold 13px sans-serif";x.fillText((meister==1?"SHADOW STAR 2X: ":(meister==2?"SOUL PIANO 2X: ":"BLACK BLOOD 2X: "))+bb.toFixed(1)+"s",w/2,110)}
    if(excalTrial>0){x.fillStyle="#ffd740";x.font="bold 13px sans-serif";x.fillText("EXCALIBUR 3X TRIAL: "+excalTrial.toFixed(1)+"s",w/2,128)}
    for(let i=0;i<3;i++){x.beginPath();x.arc(w/2-36+i*36,85,8,0,6.28);x.fillStyle=i<lv?"#4deeea":"rgba(255,255,255,.2)";x.fill()}

    x.fillStyle=meister==1&&bb<=0?"rgba(18,16,26,.75)":"rgba(255,255,255,.55)";x.font="bold 11px sans-serif";
    const resLbl=meister==0?(kHunterReady?"KISHIN HUNTER READY!":"SOUL RESONANCE ("+pfStreak+"/15)"):(meister==1?"SHADOW★STAR RESONANCE":(meister==2?(awakened?"DEATH CANNON RESONANCE":"SEVEN DAYS RESONANCE (COMBO "+cb+")"):(meister==3?"BLOODY NEEDLE RESONANCE":(awakened?"AOE GUILLOTINE AWAKENED!":"SILVER GUN RESONANCE"))));
    x.fillText(resLbl,w/2,h-58);

    x.fillStyle="rgba(255,255,255,.2)";x.fillRect(w/2-120,h-48,240,10);
    x.fillStyle=meister==1?"#00b4ff":(meister==2?"#e040fb":(meister==3?"#ff1e42":(meister==4?"#facc15":(kHunterReady?"#ffd740":(bb>0?"#ff1e42":"#4deeea")))));
    x.fillRect(w/2-120,h-48,240*(rs/100),10);

    if(go){
      x.fillStyle="rgba(18,16,26,.85)";x.fillRect(0,0,w,h);
      x.fillStyle="#ff2a55";x.font="bold 38px sans-serif";x.fillText("SOUL CONSUMED",w/2,h/2-20);
      x.fillStyle="#fff";x.font="20px sans-serif";x.fillText("Final Score: "+sc+" (Best: "+saveData.hi[meister]+")",w/2,h/2+20);
      x.fillStyle="#4deeea";x.font="bold 15px sans-serif";x.fillText("TAP OR PRESS SPACE TO CHANGE MEISTER",w/2,h/2+65);
    }
  }
  x.restore();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

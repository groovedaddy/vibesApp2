      }

      function jump() {
        if (isGrounded && !isDucking) {

          isGrounded = false;
        }
      }

        if (isDucking && isGrounded) {

        } else {
          gameEl.classList.remove('paused');
          pauseBtn.textContent = 'PAUSE';
          messageEl.style.display = 'none';
          gameLoop();
        }
      }

      function spawnObstacle() {
        const isBird = Math.random() < 0.45;
        const el = document.createElement('div');
        const gameWidth = gameEl.clientWidth || 800;

        if (isBird) {
          el.className = 'bird';
          const heights = new Array(65, 95, 125);
          const idx = Math.floor(Math.random() * heights.length);
          const baseBottom = heights.at(idx);
          el.style.left = gameWidth + 'px';
          el.style.bottom = baseBottom + 'px';
          gameEl.appendChild(el);

          obstacles.push({
            type: 'bird',
            el: el,
            x: gameWidth,
            bottom: baseBottom,
            baseBottom: baseBottom,
            width: 22,
            height: 12,
            speedBonus: 2.2 + Math.random() * 1.5,
            waveOffset: Math.random() * 10
          });
        } else {
          el.className = 'cactus';
          const width = Math.random() < 0.5 ? 18 : 30;
          const height = Math.random() < 0.5 ? 36 : 48;
          el.style.width = width + 'px';
          el.style.height = height + 'px';
          el.style.left = gameWidth + 'px';
          gameEl.appendChild(el);

          obstacles.push({
            type: 'cactus',
            el: el,
            x: gameWidth,
            bottom: groundLevel,
            width: width,
            height: height,
            speedBonus: 0
          });
        }
      }

      function checkCollision(obs) {
        const dinoLeft = 50;
        const dinoWidth = isDucking && isGrounded ? 50 : 36;
        const dinoHeight = isDucking && isGrounded ? 24 : 44;
        const pad = 4;

        const overlapX = (dinoLeft + dinoWidth - pad) > (obs.x + pad) &&

        const overlapY = (dinoBottom + dinoHeight - pad) > (obs.bottom + pad) &&
                         (dinoBottom + pad) < (obs.bottom + obs.height - pad);

        return overlapX && overlapY;

      function endGame() {
        isPlaying = false;
        isPaused = false;
        if (loopId) cancelAnimationFrame(loopId);
        gameEl.classList.remove('paused');
        pauseBtn.style.display = 'none';

        pauseBtn.textContent = 'PAUSE';
        pauseBtn.style.display = 'block';
        messageEl.style.display = 'none';
        updateScoreDisplay();
        gameLoop();
      }

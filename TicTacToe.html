<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .scoreboard {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      background: #1e293b;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
    }

    .score-x { color: #38bdf8; }
    .score-o { color: #fb7185; }
    .score-draw { color: #94a3b8; }

    #status {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      min-height: 1.6em;
      color: #e2e8f0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 10px;
      margin-bottom: 24px;
    }

    .cell {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      font-size: 3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .cell:hover:not(.taken) {
      background: #334155;
      transform: scale(1.03);
    }

    .cell.x {
      color: #38bdf8;
    }

    .cell.o {
      color: #fb7185;
    }

    .cell.win {
      background: #065f46;
      border-color: #10b981;
      color: #ecfdf5;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    #restartBtn {
      background: #38bdf8;
      color: #0f172a;
    }

    #resetScoreBtn {
      background: #334155;
      color: #f8fafc;
    }

    @media (max-width: 400px) {
      .board {
        grid-template-columns: repeat(3, 90px);
        grid-template-rows: repeat(3, 90px);
      }
    }
  </style>
</head>
<body>
<style id="vibe-apps-navigation">#vibe-back-link{position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:inline-flex!important;align-items:center!important;gap:8px!important;padding:10px 15px!important;border-radius:999px!important;background:#12243d!important;color:#fff!important;font:600 14px/1.2 system-ui,-apple-system,sans-serif!important;text-decoration:none!important;box-shadow:0 4px 18px #0006!important;border:1px solid #ffffff55!important}#vibe-back-link:hover,#vibe-back-link:focus{background:#255b9c!important;outline:2px solid #fff!important;outline-offset:2px!important}@media(max-width:600px){#vibe-back-link{top:8px!important;left:8px!important;padding:8px 11px!important;font-size:12px!important}}</style>
<a id="vibe-back-link" href="index.html" aria-label="Back to Vibe Apps 1">← Back to Vibe Apps 1</a>

  <h1>Tic-Tac-Toe</h1>

  <div class="scoreboard">
    <span class="score-x">X: <span id="scoreX">0</span></span>
    <span class="score-draw">Draws: <span id="scoreDraw">0</span></span>
    <span class="score-o">O: <span id="scoreO">0</span></span>
  </div>

  <div id="status">Player X's turn</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="controls">
    <button id="restartBtn">New Round</button>
    <button id="resetScoreBtn">Reset Scores</button>
  </div>

  <script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");
    const resetScoreBtn = document.getElementById("resetScoreBtn");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");
    const scoreDrawEl = document.getElementById("scoreDraw");

    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameActive = true;
    let scores = { X: 0, O: 0, draw: 0 };

    function handleCellClick(e) {
      const index = e.target.getAttribute("data-index");

      if (board[index] !== "" || !gameActive) return;

      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add(currentPlayer.toLowerCase(), "taken");

      checkResult();
    }

    function checkResult() {
      let winningCombo = null;

      for (const condition of winConditions) {
        const [a, b, c] = condition;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          winningCombo = condition;
          break;
        }
      }

      if (winningCombo) {
        statusText.textContent = `Player ${currentPlayer} wins!`;
        gameActive = false;
        winningCombo.forEach(idx => cells[idx].classList.add("win"));
        scores[currentPlayer]++;
        updateScoreboard();
        return;
      }

      if (!board.includes("")) {
        statusText.textContent = "It's a draw!";
        gameActive = false;
        scores.draw++;
        updateScoreboard();
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusText.textContent = `Player ${currentPlayer}'s turn`;
    }

    function updateScoreboard() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDrawEl.textContent = scores.draw;
    }

    function restartRound() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameActive = true;
      statusText.textContent = "Player X's turn";
      cells.forEach(cell => {
        cell.textContent = "";
        cell.className = "cell";
      });
    }

    function resetScores() {
      scores = { X: 0, O: 0, draw: 0 };
      updateScoreboard();
      restartRound();
    }

    cells.forEach(cell => cell.addEventListener("click", handleCellClick));
    restartBtn.addEventListener("click", restartRound);
    resetScoreBtn.addEventListener("click", resetScores);
  </script>
</body>
</html>
